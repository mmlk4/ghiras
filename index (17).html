<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --primary: #6B2D8B;
  --primary-light: #8E44AD;
  --primary-lighter: #F3E8F9;
  --primary-dark: #512071;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --text: #1A2B3C;
  --text-secondary: #6B7C8D;
  --text-light: #9CAAB8;
  --border: #E8ECF0;
  --success: #27AE60;
  --success-light: #E8F8EF;
  --warning: #E67E22;
  --warning-light: #FEF5E7;
  --danger: #E74C3C;
  --danger-light: #FDEDEC;
  --exam: #E67E22;
  --exam-light: #FEF5E7;
  --streak: #F39C12;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-height: 72px;
  --header-height: 60px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Alan Sans', -apple-system, 'SF Pro Arabic', 'Geeza Pro', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  padding-top: calc(var(--header-height) + var(--safe-top));
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
}

/* Header */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: calc(var(--header-height) + var(--safe-top));
  padding-top: var(--safe-top);
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(107,45,139,0.3);
}

.header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.header-subtitle {
  font-size: 0.75rem;
  opacity: 0.85;
  margin-right: 8px;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid var(--border);
  z-index: 100;
}

.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-light);
  font-size: 0.7rem;
  font-family: inherit;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 12px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.active {
  color: var(--primary);
}

.nav-btn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Pages */
.page {
  display: none;
  padding: 16px;
  max-width: 600px;
  margin: 0 auto;
  animation: fadeIn 0.25s ease;
}

.page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

/* Dashboard Stats Row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 10px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}

.stat-value.streak-value {
  color: var(--streak);
}

.stat-label {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Motivational Message */
.motivation-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  text-align: center;
  padding: 20px;
  border: none;
}

.motivation-card .emoji { font-size: 1.5rem; margin-bottom: 8px; }
.motivation-card .msg { font-size: 0.95rem; line-height: 1.8; }

/* Progress Circle */
.progress-ring-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 16px 0;
}

.progress-ring {
  width: 120px;
  height: 120px;
  position: relative;
}

.progress-ring svg {
  transform: rotate(-90deg);
  width: 120px;
  height: 120px;
}

.progress-ring .bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 8;
}

.progress-ring .fg {
  fill: none;
  stroke: var(--primary);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}

.progress-ring .center-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.progress-ring .pct {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--primary);
}

.progress-ring .pct-label {
  font-size: 0.7rem;
  color: var(--text-secondary);
}

/* Task Cards */
.task-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all 0.3s;
}

.task-card.completed {
  border-color: var(--success);
  background: var(--success-light);
}

.task-card.locked {
  opacity: 0.6;
  pointer-events: none;
}

.task-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.task-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}

.task-badge {
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
}

.badge-pending { background: var(--warning-light); color: var(--warning); }
.badge-complete { background: var(--success-light); color: var(--success); }
.badge-locked { background: #f0f0f0; color: #999; }

/* Counter */
.counter-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 12px 0;
}

.counter-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  background: white;
  color: var(--primary);
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.counter-btn:active {
  transform: scale(0.9);
  background: var(--primary);
  color: white;
}

.counter-btn.plus { background: var(--primary); color: white; border-color: var(--primary); }
.counter-btn.plus:active { background: var(--primary-dark); }

.counter-display {
  text-align: center;
  min-width: 80px;
}

.counter-current {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}

.counter-target {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.counter-input {
  width: 70px;
  text-align: center;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary);
  border: none;
  background: transparent;
  font-family: inherit;
  outline: none;
  border-bottom: 2px solid transparent;
}

.counter-input:focus {
  border-bottom-color: var(--primary);
}

/* Progress Bar */
.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 0.4s ease;
}

.progress-bar-fill.complete {
  background: var(--success);
}

/* Checkbox Task */
.checkbox-task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}

.checkbox-custom {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.checkbox-custom.checked {
  background: var(--success);
  border-color: var(--success);
}

.checkbox-custom svg {
  width: 16px;
  height: 16px;
  stroke: white;
  stroke-width: 3;
  fill: none;
  opacity: 0;
  transition: opacity 0.2s;
}

.checkbox-custom.checked svg { opacity: 1; }

.checkbox-label {
  font-size: 0.95rem;
  color: var(--text);
}

/* Sub-task (repetition pages) */
.sub-task {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
}

.sub-task-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-align: center;
}

/* Period Info */
.period-info {
  text-align: center;
  margin-bottom: 16px;
}

.period-day {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
}

.period-time {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.period-countdown {
  font-size: 0.75rem;
  color: var(--warning);
  margin-top: 4px;
  font-weight: 600;
}

/* Exam Button */
.exam-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border: 2px solid var(--exam);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--exam);
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 16px;
  width: 100%;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.exam-toggle.active {
  background: var(--exam);
  color: white;
}

/* Settings */
.setting-group {
  margin-bottom: 24px;
}

.setting-label {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.setting-desc {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.setting-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 1.1rem;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
  text-align: center;
  font-weight: 700;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.setting-input:focus {
  outline: none;
  border-color: var(--primary);
}

/* Data buttons */
.data-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  flex: 1;
  text-align: center;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:active { background: var(--primary-dark); }

.btn-outline {
  background: white;
  color: var(--primary);
  border: 2px solid var(--primary);
}

.btn-danger {
  background: white;
  color: var(--danger);
  border: 2px solid var(--danger);
}

/* Calendar */
.calendar {
  margin-top: 12px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.calendar-title {
  font-size: 1rem;
  font-weight: 700;
}

.calendar-nav {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  -webkit-tap-highlight-color: transparent;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-day-name {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-light);
  font-weight: 600;
  padding: 4px 0;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  border-radius: 8px;
  color: var(--text);
  font-weight: 500;
  position: relative;
}

.cal-day.empty { visibility: hidden; }
.cal-day.today { font-weight: 800; border: 2px solid var(--primary); }
.cal-day.complete { background: var(--success); color: white; }
.cal-day.partial { background: var(--warning-light); color: var(--warning); }
.cal-day.missed { background: var(--danger-light); color: var(--danger); }
.cal-day.exam { background: var(--exam-light); color: var(--exam); }
.cal-day.off { color: var(--text-light); }
.cal-day.future { color: var(--text-light); }

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
  justify-content: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: white;
  padding: 12px 24px;
  border-radius: 25px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Notice banner */
.notice {
  background: var(--primary-lighter);
  color: var(--primary-dark);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  margin-bottom: 16px;
  line-height: 1.6;
  text-align: center;
}

.notice-warning {
  background: var(--warning-light);
  color: #8B5E00;
}

/* Weekly card */
.weekly-card {
  border: 2px solid var(--primary-light);
  background: var(--primary-lighter);
}

/* Responsive */
@media (min-width: 768px) {
  .page { padding: 24px; }
  .stats-row { gap: 16px; }
  .counter-btn { width: 56px; height: 56px; }
}

/* File input hidden */
.file-input-hidden {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  overflow: hidden;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: var(--shadow-lg);
}

.modal h3 {
  font-size: 1.1rem;
  margin-bottom: 12px;
}

.modal p {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

/* Section headers on pages */
.section-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  margin-top: 20px;
}

.section-title:first-child { margin-top: 0; }

/* Stat summary cards in achievements */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.summary-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}

.summary-value {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--primary);
}

.summary-label {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 0; }

/* Week progress */
.week-progress {
  display: flex;
  gap: 6px;
  margin: 12px 0;
}

.week-day-dot {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: var(--border);
}

.week-day-dot.complete { background: var(--success); }
.week-day-dot.partial { background: var(--warning); }
.week-day-dot.current { background: var(--primary); animation: pulse 1.5s infinite; }
.week-day-dot.exam-dot { background: var(--exam); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.week-labels {
  display: flex;
  gap: 6px;
}

.week-label {
  flex: 1;
  text-align: center;
  font-size: 0.6rem;
  color: var(--text-light);
}
</style>

function getDefaultData() {

    settings: {
      studentName: '',
      listeningTarget: 5,

    },
    records: {},
    version: 1
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      appData = JSON.parse(raw);
      if (!appData.settings) appData.settings = getDefaultData().settings;
      if (!appData.records) appData.records = {};

      appData = getDefaultData();

    appData = getDefaultData();
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch(e) {
    console.warn('Failed to save data', e);
  }
}

// =============================================
// TIMEZONE & TIMING
// =============================================
function getNowRiyadh() {
  const str = new Date().toLocaleString('en-US', { timeZone: 'Asia/Riyadh' });
  return new Date(str);
}

function getDateKeyRiyadh(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getCurrentPeriod() {
  const now = getNowRiyadh();
  const dow = now.getDay(); // 0=Sun..6=Sat
  const hour = now.getHours();
  const min = now.getMinutes();

  // Saturday (6): Sunday tasks
  if (dow === 6) {
    return makeDailyPeriod(now, 0, 'الأحد');
  }
  // Friday (5): Weekly linking
  if (dow === 5) {
    return makeWeeklyPeriod(now);
  }
  // Thursday (4)
  if (dow === 4) {
    if (hour < 9) return makeDailyPeriod(now, 4, 'الخميس');
    return makeWeeklyPeriod(now);
  }
  // Sunday (0) through Wednesday (3)
  if (hour < 9) {
    return makeDailyPeriod(now, dow, TASK_DAYS_AR[dow]);
  }
  return makeDailyPeriod(now, dow + 1, TASK_DAYS_AR[dow + 1]);
}

function makeDailyPeriod(now, taskDayIndex, taskDayName) {
  const key = computePeriodKey(now, 'daily', taskDayIndex);
  const endTime = computePeriodEnd(now, 'daily', taskDayIndex);
  return { type: 'daily', taskDayIndex, taskDayName, key, endTime };
}

function makeWeeklyPeriod(now) {
  const key = computePeriodKey(now, 'weekly');
  const endTime = computePeriodEnd(now, 'weekly');
  return { type: 'weekly', taskDayName: 'الربط الأسبوعي', key, endTime };
}

function computePeriodKey(now, type, taskDayIndex) {
  // Create a unique key based on the period start
  const dow = now.getDay();
  const hour = now.getHours();
  let startDate = new Date(now);

  if (type === 'weekly') {
    // Weekly starts Thursday 9 AM
    // Find the most recent Thursday
    let daysBack = (dow - 4 + 7) % 7;
    if (daysBack === 0 && hour < 9) daysBack = 7;
    startDate.setDate(now.getDate() - daysBack);
    startDate.setHours(9, 0, 0, 0);
    return `weekly_${getDateKeyRiyadh(startDate)}`;
  }

  // Daily period
  if (taskDayIndex === 0) {
    // Sunday tasks start Saturday 00:00
    if (dow === 6) {
      startDate.setHours(0, 0, 0, 0);
    } else {
      // Sunday before 9 AM - started previous Saturday
      startDate.setDate(now.getDate() - 1);
      startDate.setHours(0, 0, 0, 0);
    }
  } else {
    // Tasks start previous day at 9 AM
    if (hour < 9 && dow === taskDayIndex) {
      // We're on the actual day before 9 AM, started yesterday
      startDate.setDate(now.getDate() - 1);
    }
    startDate.setHours(9, 0, 0, 0);
  }
  return `daily_${TASK_DAYS_AR[taskDayIndex]}_${getDateKeyRiyadh(startDate)}`;
}

function computePeriodEnd(now, type, taskDayIndex) {
  const dow = now.getDay();
  const hour = now.getHours();
  let endDate = new Date(now);

  if (type === 'weekly') {
    // Weekly ends Saturday 00:00
    let daysToSat = (6 - dow + 7) % 7;
    if (daysToSat === 0 && dow === 6) daysToSat = 0; // already Saturday, should have switched
    if (daysToSat === 0) daysToSat = 7;
    // Actually: weekly linking runs Thu 9AM to Sat 00:00
    // From Thursday after 9: ends Saturday midnight
    // From Friday: ends Saturday midnight
    if (dow === 4) {
      daysToSat = 2;
    } else if (dow === 5) {
      daysToSat = 1;
    }
    endDate.setDate(now.getDate() + daysToSat);
    endDate.setHours(0, 0, 0, 0);
    return endDate;
  }

  // Daily
  if (taskDayIndex === 0) {
    // Sunday tasks end Sunday 9 AM
    if (dow === 6) {
      endDate.setDate(now.getDate() + 1);
      endDate.setHours(9, 0, 0, 0);
    } else {
      // dow === 0, before 9
      endDate.setHours(9, 0, 0, 0);
    }
  } else {
    // Tasks for dayX end on dayX at 9 AM
    if (dow < taskDayIndex || (dow === taskDayIndex && hour < 9)) {
      // End is today or in the future
      let daysAhead = taskDayIndex - dow;
      if (daysAhead < 0) daysAhead += 7;
      endDate.setDate(now.getDate() + daysAhead);
      endDate.setHours(9, 0, 0, 0);
    } else {
      // Same day after 9 - this shouldn't happen for the current period
      endDate.setDate(now.getDate() + 1);
      endDate.setHours(9, 0, 0, 0);
    }
  }
  return endDate;
}

function isPeriodActive(period) {
  const now = getNowRiyadh();
  return now < period.endTime;
}

function getTimeRemaining(endTime) {
  const now = getNowRiyadh();
  const diff = endTime - now;
  if (diff <= 0) return null;
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  if (hours > 24) {
    const days = Math.floor(hours / 24);
    return `${days} يوم و ${hours % 24} ساعة`;
  }
  if (hours > 0) return `${hours} ساعة و ${minutes} دقيقة`;
  return `${minutes} دقيقة`;
}

// =============================================
// RECORD MANAGEMENT
// =============================================
function getOrCreateRecord(period) {
  if (!appData.records[period.key]) {
    const settings = appData.settings;
    const rec = {
      type: period.type,
      taskDayName: period.taskDayName,
      taskDayIndex: period.taskDayIndex,
      createdAt: new Date().toISOString(),
      isExamDay: false
    };

    if (period.type === 'daily') {
      rec.listening = { current: 0, target: settings.listeningTarget };
      rec.repetition = [
        { current: 0, target: settings.repetitionTarget },
        { current: 0, target: settings.repetitionTarget },
        { current: 0, target: settings.repetitionTarget }
      ];
      rec.review = false;
      rec.dailyLinking = false;
    } else {
      rec.weeklyLinking = { current: 0, target: settings.weeklyLinkingTarget };
    }

    appData.records[period.key] = rec;
    saveData();
  }
  return appData.records[period.key];
}

function isRecordComplete(rec) {
  if (rec.isExamDay) return false; // neutral
  if (rec.type === 'daily') {
    const listenOk = rec.listening.current >= rec.listening.target;
    const repOk = rec.repetition.every(r => r.current >= r.target);
    return listenOk && repOk && rec.review && rec.dailyLinking;
  }
  if (rec.type === 'weekly') {
    return rec.weeklyLinking.current >= rec.weeklyLinking.target;
  }
  return false;
}

function getDailyProgress(rec) {
  if (rec.type !== 'daily') return 0;
  let total = 0, done = 0;
  // Listening
  total++;
  if (rec.listening.current >= rec.listening.target) done++;
  // 3 repetition pages
  rec.repetition.forEach(r => {
    total++;
    if (r.current >= r.target) done++;
  });
  // Review
  total++;
  if (rec.review) done++;
  // Daily linking
  total++;
  if (rec.dailyLinking) done++;
  return done / total;
}

// =============================================
// STREAK CALCULATIONS
// =============================================
function calculateStats() {
  const records = appData.records;
  let totalComplete = 0;
  let totalListening = 0;
  let totalRepPages = 0;
  let totalWeeklyLinking = 0;

  // Collect daily records sorted by date
  const dailyRecords = [];

  for (const [key, rec] of Object.entries(records)) {
    if (rec.type === 'daily') {
      if (rec.listening) totalListening += rec.listening.current;
      if (rec.repetition) {
        rec.repetition.forEach(r => {
          if (r.current >= r.target) totalRepPages++;
        });
      }
      dailyRecords.push({ key, rec, date: rec.createdAt });
      if (isRecordComplete(rec)) totalComplete++;
    }
    if (rec.type === 'weekly' && rec.weeklyLinking) {
      totalWeeklyLinking += rec.weeklyLinking.current;
    }
  }

  // Sort daily records by creation date
  dailyRecords.sort((a, b) => a.date.localeCompare(b.date));

  // Calculate streaks
  let currentStreak = 0;
  let longestStreak = 0;
  let tempStreak = 0;

  // We need to identify consecutive task days
  // A task day is complete if all tasks are done
  // Exam days don't break the streak
  for (let i = dailyRecords.length - 1; i >= 0; i--) {
    const r = dailyRecords[i].rec;
    if (r.isExamDay) continue; // skip, don't break
    if (isRecordComplete(r)) {
      currentStreak++;
    } else {
      break;
    }
  }

  // Check if the latest period is still active and not yet complete
  const period = getCurrentPeriod();
  const currentRec = appData.records[period.key];
  if (period.type === 'daily' && currentRec && !currentRec.isExamDay && !isRecordComplete(currentRec)) {
    // Current period is active and not complete - streak might still be valid
    // Don't count current incomplete period against streak
    // Recalculate from the previous record
    currentStreak = 0;
    for (let i = dailyRecords.length - 1; i >= 0; i--) {
      const r = dailyRecords[i].rec;
      const k = dailyRecords[i].key;
      if (k === period.key) continue; // skip current active period
      if (r.isExamDay) continue;
      if (isRecordComplete(r)) {
        currentStreak++;
      } else {
        break;
      }
    }
  }

  // Calculate longest streak
  tempStreak = 0;
  for (let i = 0; i < dailyRecords.length; i++) {
    const r = dailyRecords[i].rec;
    if (r.isExamDay) continue;
    if (isRecordComplete(r)) {
      tempStreak++;
      longestStreak = Math.max(longestStreak, tempStreak);
    } else {
      tempStreak = 0;
    }
  }
  longestStreak = Math.max(longestStreak, currentStreak);

  return {
    currentStreak,
    longestStreak,
    totalComplete,
    totalListening,
    totalRepPages,
    totalWeeklyLinking
  };
}

// =============================================
// WEEK PROGRESS
// =============================================
function getWeekDayStatuses() {
  const period = getCurrentPeriod();
  const now = getNowRiyadh();
  const statuses = [];

  // We need to find records for each day of the current week
  // Week: Sun, Mon, Tue, Wed, Thu
  for (let i = 0; i < 5; i++) {
    const dayName = TASK_DAYS_AR[i];
    // Find matching record
    let found = null;
    for (const [key, rec] of Object.entries(appData.records)) {
      if (rec.type === 'daily' && rec.taskDayName === dayName) {
        // Check if it's from the current week (rough check)
        const created = new Date(rec.createdAt);
        const diffDays = Math.abs((now - created) / (1000 * 60 * 60 * 24));
        if (diffDays < 8) {
          found = rec;
        }
      }
    }

    if (period.type === 'daily' && period.taskDayIndex === i) {
      statuses.push('current');
    } else if (found) {
      if (found.isExamDay) statuses.push('exam');
      else if (isRecordComplete(found)) statuses.push('complete');
      else if (getDailyProgress(found) > 0) statuses.push('partial');
      else statuses.push('missed');
    } else {
      // Future or no record
      const taskDow = i; // 0=Sun
      if (now.getDay() < taskDow || (now.getDay() === taskDow && now.getHours() < 9)) {
        statuses.push('future');
      } else {
        statuses.push('none');
      }
    }
  }
  return statuses;
}

  currentPage = pageName;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageName).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === pageName);
  });
  renderCurrentPage();
}

function renderCurrentPage() {
  switch(currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'tasks': renderTasks(); break;
    case 'achievements': renderAchievements(); break;
    case 'settings': renderSettings(); break;
  }
}

  const pct = Math.round(progress * 100);
  const remaining = getTimeRemaining(period.endTime);
  const msg = MOTIVATIONAL_MSGS[Math.floor(Date.now() / (1000 * 60 * 60)) % MOTIVATIONAL_MSGS.length];

  const offset = circumference - (progress * circumference);

    if (s === 'complete') cls += ' complete';
    else if (s === 'partial') cls += ' partial';
    else if (s === 'current') cls += ' current';
    else if (s === 'exam') cls += ' exam-dot';

    `<div class="week-label">${d}</div>`
  ).join('');

    const tasks = [];

    else tasks.push('○ السماع');
    const repDone = rec.repetition.filter(r => r.current >= r.target).length;

    else tasks.push(`○ التكرار (${repDone}/3)`);

    else tasks.push('○ المراجعة');

      </div>
      <div class="stat-card">
        <div class="stat-value">${stats.longestStreak}</div>
        <div class="stat-label">أطول سلسلة</div>
      </div>

function renderTasks() {
  const el = document.getElementById('page-tasks');
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  const active = isPeriodActive(period);
  const remaining = getTimeRemaining(period.endTime);

  let html = `
    <div class="period-info">
      <div class="period-day">مهام يوم ${period.taskDayName}</div>
      ${remaining ? `<div class="period-countdown">⏱ متبقي ${remaining}</div>` : '<div class="period-countdown" style="color:var(--danger)">انتهت الفترة</div>'}
    </div>
  `;

  if (period.type === 'daily' && active) {
    html += `
      <button class="exam-toggle ${rec.isExamDay ? 'active' : ''}" onclick="toggleExam()">
        📝 ${rec.isExamDay ? 'إلغاء يوم الاختبار' : 'اليوم اختبار'}
      </button>
    `;
  }

  if (rec.isExamDay) {
    html += `<div class="notice" style="background:var(--exam-light);color:var(--exam)">📝 يوم اختبار — المهام اليومية مُعلَّقة ولن تؤثر على المداومة</div>`;
    el.innerHTML = html;
    return;
  }

  if (period.type === 'daily') {
    const locked = !active;

    // 1. Listening
    html += renderCounterTask('السماع', rec.listening, locked, (val) => {
      rec.listening.current = Math.max(0, Math.min(9999, val));
      saveData(); renderTasks(); renderDashboard();
    });

    // 2. Repetition (3 pages)
    html += `<div class="task-card ${locked ? 'locked' : ''} ${rec.repetition.every(r=>r.current>=r.target) ? 'completed' : ''}">
      <div class="task-header">
        <div class="task-name">تكرار المحفوظ</div>
        <div class="task-badge ${rec.repetition.every(r=>r.current>=r.target) ? 'badge-complete' : 'badge-pending'}">
          ${rec.repetition.filter(r=>r.current>=r.target).length}/3
        </div>
      </div>`;

    for (let i = 0; i < 3; i++) {
      const page = rec.repetition[i];
      const pagePct = Math.min(100, Math.round((page.current / Math.max(1, page.target)) * 100));
      html += `
        <div class="sub-task">
          <div class="sub-task-label">الوجه ${i + 1}</div>
          ${renderCounterControls(page, locked, i)}
          <div class="progress-bar">
            <div class="progress-bar-fill ${page.current >= page.target ? 'complete' : ''}" style="width:${pagePct}%"></div>
          </div>
        </div>`;
    }
    html += `</div>`;

    // 3. Review
    html += `
      <div class="task-card ${locked ? 'locked' : ''} ${rec.review ? 'completed' : ''}">
        <div class="task-header">
          <div class="task-name">المراجعة</div>
          <div class="task-badge ${rec.review ? 'badge-complete' : 'badge-pending'}">${rec.review ? 'مكتملة' : 'لم تكتمل'}</div>
        </div>
        <div class="checkbox-task" onclick="${locked ? '' : 'toggleReview()'}">
          <div class="checkbox-custom ${rec.review ? 'checked' : ''}">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="checkbox-label">تمت المراجعة</span>
        </div>
      </div>`;

    // 4. Daily Linking
    html += `
      <div class="task-card ${locked ? 'locked' : ''} ${rec.dailyLinking ? 'completed' : ''}">
        <div class="task-header">
          <div class="task-name">الربط اليومي</div>
          <div class="task-badge ${rec.dailyLinking ? 'badge-complete' : 'badge-pending'}">${rec.dailyLinking ? 'مكتمل' : 'لم يكتمل'}</div>
        </div>
        <div class="checkbox-task" onclick="${locked ? '' : 'toggleDailyLinking()'}">
          <div class="checkbox-custom ${rec.dailyLinking ? 'checked' : ''}">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="checkbox-label">تم الربط اليومي</span>
        </div>
      </div>`;

  } else {
    // Weekly linking
    const locked = !active;
    html += renderCounterTask('الربط الأسبوعي', rec.weeklyLinking, locked, (val) => {
      rec.weeklyLinking.current = Math.max(0, Math.min(9999, val));
      saveData(); renderTasks(); renderDashboard();
    }, true);
  }

  el.innerHTML = html;
}

function renderCounterTask(name, data, locked, onChange, isWeekly) {
  const pct = Math.min(100, Math.round((data.current / Math.max(1, data.target)) * 100));
  const complete = data.current >= data.target;
  const id = name.replace(/\s/g, '_');

  return `

function renderCalendar(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const totalDays = lastDay.getDate();
  const now = getNowRiyadh();
  const todayKey = getDateKeyRiyadh(now);

  // Day headers (Sat first for Arabic calendar)
  const dayHeaders = ['ح', 'ن', 'ث', 'ر', 'خ', 'ج', 'س'];

  let grid = dayHeaders.map(d => `<div class="cal-day-name">${d}</div>`).join('');

  // Empty cells before first day
  for (let i = 0; i < startDow; i++) {
    grid += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= totalDays; d++) {
    const dateObj = new Date(year, month, d);
    const dateKey = getDateKeyRiyadh(dateObj);
    const dow = dateObj.getDay();
    const isToday = dateKey === todayKey;
    const isFuture = dateObj > now;
    const isOff = dow === 5 || dow === 6; // Friday or Saturday

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isFuture) {
      cls += ' future';
    } else if (isOff) {
      cls += ' off';
    } else {
      // Look for a record matching this date
      const status = getDayStatus(dateObj);
      if (status === 'complete') cls += ' complete';
      else if (status === 'partial') cls += ' partial';
      else if (status === 'exam') cls += ' exam';
      else if (status === 'missed') cls += ' missed';
    }

    grid += `<div class="${cls}">${d}</div>`;
  }

  return `
    <div class="calendar">
      <div class="calendar-header">
        <button class="calendar-nav" onclick="changeMonth(-1)">→</button>
        <div class="calendar-title">${MONTH_NAMES_AR[month]} ${year}</div>
        <button class="calendar-nav" onclick="changeMonth(1)">←</button>
      </div>
      <div class="calendar-grid">${grid}</div>
    </div>`;
}

function getDayStatus(dateObj) {
  const dow = dateObj.getDay();
  if (dow === 5 || dow === 6) return 'off';

  // Find a record for this day
  for (const [key, rec] of Object.entries(appData.records)) {
    if (rec.type !== 'daily') continue;
    const created = new Date(rec.createdAt);
    // Check if this record's task day matches the dateObj's day of week
    if (rec.taskDayIndex === dow) {
      // Check if dates are close (within same week)
      const createdKey = getDateKeyRiyadh(created);
      const dateKey = getDateKeyRiyadh(dateObj);
      // The record was created 1 day before the task day (roughly)
      const diff = Math.abs(dateObj - created) / (1000 * 60 * 60 * 24);
      if (diff < 3) {
        if (rec.isExamDay) return 'exam';
        if (isRecordComplete(rec)) return 'complete';
        if (getDailyProgress(rec) > 0) return 'partial';
        return 'missed';
      }
    }
  }
  // Check if date is in the past
  const now = getNowRiyadh();
  if (dateObj < now) return 'none'; // no record found, could be before app use
  return 'future';
}

function changeMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  renderAchievements();
}

// =============================================
// ACTIONS
// =============================================
function updateCounter(id, delta) {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period)) return;

  if (id === 'السماع') {
    rec.listening.current = Math.max(0, rec.listening.current + delta);
    if (rec.listening.current >= rec.listening.target && delta > 0) showToast('✓ أحسنتِ! تم إكمال السماع');
  } else if (id === 'الربط_الأسبوعي') {
    rec.weeklyLinking.current = Math.max(0, rec.weeklyLinking.current + delta);
    if (rec.weeklyLinking.current >= rec.weeklyLinking.target && delta > 0) showToast('✓ تم إكمال الربط الأسبوعي');
  }

  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
  checkComplete(rec);
}

function setCounter(id, val) {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period)) return;
  val = Math.max(0, Math.min(9999, val));

  if (id === 'السماع') rec.listening.current = val;
  else if (id === 'الربط_الأسبوعي') rec.weeklyLinking.current = val;

  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
}

function updateRepetition(pageIndex, delta) {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period) || rec.type !== 'daily') return;

  rec.repetition[pageIndex].current = Math.max(0, rec.repetition[pageIndex].current + delta);
  if (rec.repetition[pageIndex].current >= rec.repetition[pageIndex].target && delta > 0) {
    showToast(`✓ أحسنتِ! تم إكمال الوجه ${pageIndex + 1}`);
  }

  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
  checkComplete(rec);
}

function setRepetition(pageIndex, val) {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period) || rec.type !== 'daily') return;

  rec.repetition[pageIndex].current = Math.max(0, Math.min(9999, val));
  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
}

function toggleReview() {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period) || rec.type !== 'daily') return;

  rec.review = !rec.review;
  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
  if (rec.review) showToast('✓ تمت المراجعة');
  checkComplete(rec);
}

function toggleDailyLinking() {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period) || rec.type !== 'daily') return;

  rec.dailyLinking = !rec.dailyLinking;
  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
  if (rec.dailyLinking) showToast('✓ تم الربط اليومي');
  checkComplete(rec);
}

function toggleExam() {
  const period = getCurrentPeriod();
  const rec = getOrCreateRecord(period);
  if (!isPeriodActive(period)) return;

  rec.isExamDay = !rec.isExamDay;
  saveData();
  renderTasks();
  if (currentPage === 'dashboard') renderDashboard();
  if (rec.isExamDay) showToast('📝 تم تحديد اليوم كيوم اختبار');
  else showToast('تم إلغاء يوم الاختبار');
}

function checkComplete(rec) {
  if (isRecordComplete(rec) && !rec._notified) {
    rec._notified = true;
    setTimeout(() => showToast('🎉 ما شاء الله! أتممتِ جميع المهام'), 500);
  }
}

function updateNameSetting(value) {
  appData.settings.studentName = value.trim();
  saveData();
  showToast('✓ تم حفظ الاسم');
  if (currentPage === 'dashboard') renderDashboard();
}

function updateSetting(key, value) {
  const val = parseInt(value);
  if (isNaN(val) || val < 1) return;
  appData.settings[key] = val;
  saveData();
  showToast('✓ تم تحديث الإعدادات');
}

// =============================================
// DATA MANAGEMENT
// =============================================
function exportData() {
  const dataStr = JSON.stringify(appData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ghiras_backup_${getDateKeyRiyadh(getNowRiyadh())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ تم تصدير البيانات');
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.settings && imported.records) {
        showModal('استيراد البيانات', 'سيتم استبدال جميع البيانات الحالية بالبيانات المستوردة. هل تريدين المتابعة؟', () => {
          appData = imported;
          saveData();
          renderCurrentPage();
          showToast('✓ تم استيراد البيانات بنجاح');
        });
      } else {
        showToast('⚠ ملف غير صالح');
      }
    } catch(err) {
      showToast('⚠ خطأ في قراءة الملف');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmReset() {
  showModal('مسح جميع البيانات', 'سيتم حذف جميع البيانات والإعدادات والإنجازات نهائيًا. هذا الإجراء لا يمكن التراجع عنه.', () => {
    appData = getDefaultData();
    saveData();
    renderCurrentPage();
    showToast('تم مسح جميع البيانات');
  });
}

// =============================================
// UI HELPERS
// =============================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showModal(title, body, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal-confirm').onclick = () => {
    closeModal();
    onConfirm();
  };
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// =============================================
// AUTO-TRANSITION TIMER
// =============================================
function setupTransitionTimer() {
  if (transitionTimer) clearInterval(transitionTimer);
  transitionTimer = setInterval(() => {
    renderCurrentPage();
  }, 60000); // Check every minute
}

// =============================================
// INIT
// =============================================
function init() {
  loadData();
  const now = getNowRiyadh();
  calendarMonth = now.getMonth();
  calendarYear = now.getFullYear();
  renderDashboard();
  setupTransitionTimer();
}

init();
</script>
